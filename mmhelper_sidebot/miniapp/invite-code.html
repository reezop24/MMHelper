<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invite Code</title>
  <link rel="stylesheet" href="global.css" />
  <style>
    .hidden { display: none !important; }
    .content-card p { margin: 0; line-height: 1.55; color: #f0dde1; font-size: 14px; }
    .content-card p + p { margin-top: 10px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .tab-btn { margin: 0; width: 100%; border: 1px solid #8d4d54; border-radius: 12px; padding: 10px 12px; background: rgba(56, 24, 29, 0.86); color: #f4e2e6; font-size: 13px; font-weight: 700; line-height: 1.2; }
    .tab-btn.active { background: linear-gradient(90deg, #f59e0b 0%, #f97316 100%); color: #2e1400; border-color: #f59e0b; }
    .form-grid { margin-top: 14px; display: grid; gap: 12px; }
    .field-label { display: block; margin: 0 0 6px; color: #ffeef1; font-size: 13px; font-weight: 700; }
    .field-select { width: 100%; box-sizing: border-box; border: 1px solid #8d4d54; border-radius: 10px; background: rgba(43, 18, 22, 0.92); color: #fff2f5; padding: 10px 11px; font-size: 14px; outline: none; }
    .status-text { margin-top: 12px; min-height: 24px; color: #f8e9ec; }
    .result-card, .list-card { margin-top: 14px; border: 1px solid #5a3035; border-radius: 14px; background: rgba(27, 18, 20, 0.92); padding: 14px; }
    .code-value { margin-top: 8px; color: #fff4f6; font-size: 24px; font-weight: 900; letter-spacing: 0.12em; }
    .campaign-pill { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 12px; border-radius: 999px; border: 1px solid #744147; background: rgba(38, 19, 23, 0.92); color: #ffeef1; font-size: 12px; font-weight: 700; }
    .code-list { margin-top: 12px; display: grid; gap: 10px; }
    .code-row { border: 1px solid #744147; border-radius: 12px; padding: 12px; background: rgba(38, 19, 23, 0.92); }
    .code-row-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .code-row-title { margin: 0; color: #fff4f6; font-size: 18px; font-weight: 900; letter-spacing: 0.08em; }
    .code-row-meta { margin-top: 8px; color: #f0dde1; font-size: 13px; line-height: 1.5; }
    .code-row-actions { margin-top: 10px; display: flex; justify-content: flex-end; }
    .danger-btn { margin: 0; width: auto; border: 1px solid #dc2626; border-radius: 10px; padding: 8px 12px; background: rgba(127, 29, 29, 0.96); color: #fff1f2; font-size: 12px; font-weight: 800; }
    .danger-btn.full { width: 100%; justify-content: center; text-align: center; margin-top: 12px; }
    .empty-state { margin-top: 12px; color: #d8c1c6; font-size: 13px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="top-nav">
      <button id="backBtn" type="button" class="top-back-btn">← Back</button>
    </div>

    <header class="hero">
      <img class="logo" src="logo.png" alt="Invite Code" />
      <h1>Invite Code</h1>
      <p>Admin Panel</p>
    </header>

    <section class="card content-card">
      <p>Generate dan urus invite code untuk webinar campaign semasa.</p>
      <div class="campaign-pill">Campaign aktif: <span id="campaignName">-</span></div>

      <div class="tabs">
        <button id="tabGenerate" type="button" class="tab-btn active">Generate Code</button>
        <button id="tabInfo" type="button" class="tab-btn">Code Info</button>
      </div>

      <div id="panelGenerate">
        <div class="form-grid">
          <div>
            <label for="purposeSelect" class="field-label">Generate Code Untuk</label>
            <select id="purposeSelect" class="field-select">
              <option value="webinar">Webinar</option>
            </select>
          </div>
          <div>
            <label for="seriesSelect" class="field-label">Pilih Siri Webinar</label>
            <select id="seriesSelect" class="field-select">
              <option value="1">SIRI 1</option>
              <option value="2">SIRI 2</option>
              <option value="3">SIRI 3</option>
            </select>
          </div>
        </div>

        <button id="generateBtn" type="button">Generate Code</button>
        <p id="statusText" class="status-text"></p>

        <div id="resultCard" class="result-card hidden">
          <p>Code berjaya dijana:</p>
          <p id="codeValue" class="code-value"></p>
        </div>
      </div>

      <div id="panelInfo" class="hidden">
        <div id="listCard" class="list-card">
          <p>Senarai code aktif yang belum digunakan:</p>
          <div id="codeList" class="code-list"></div>
          <p id="emptyState" class="empty-state hidden">Tiada code aktif untuk campaign semasa.</p>
          <button id="revokeAllBtn" type="button" class="danger-btn full hidden">Revoke All</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      var backBtn = document.getElementById("backBtn");
      var tabGenerate = document.getElementById("tabGenerate");
      var tabInfo = document.getElementById("tabInfo");
      var panelGenerate = document.getElementById("panelGenerate");
      var panelInfo = document.getElementById("panelInfo");
      var campaignName = document.getElementById("campaignName");
      var purposeSelect = document.getElementById("purposeSelect");
      var seriesSelect = document.getElementById("seriesSelect");
      var generateBtn = document.getElementById("generateBtn");
      var statusText = document.getElementById("statusText");
      var resultCard = document.getElementById("resultCard");
      var codeValue = document.getElementById("codeValue");
      var codeList = document.getElementById("codeList");
      var emptyState = document.getElementById("emptyState");
      var revokeAllBtn = document.getElementById("revokeAllBtn");

      function parsePayload() {
        try {
          var raw = new URLSearchParams(window.location.search).get("invite_codes_payload");
          if (!raw) return { campaign: "-", codes: [] };
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return { campaign: "-", codes: [] };
          return parsed;
        } catch (err) {
          return { campaign: "-", codes: [] };
        }
      }

      var payload = parsePayload();

      function openTab(tabName) {
        var isGenerate = tabName === "generate";
        panelGenerate.classList.toggle("hidden", !isGenerate);
        panelInfo.classList.toggle("hidden", isGenerate);
        tabGenerate.classList.toggle("active", isGenerate);
        tabInfo.classList.toggle("active", !isGenerate);
      }

      function sendToTelegram(data) {
        if (tg) {
          tg.sendData(JSON.stringify(data));
          tg.close();
          return true;
        }
        return false;
      }

      function backToMainMenu() {
        if (sendToTelegram({ type: "sidebot_back_to_main_menu" })) {
          return;
        }
        window.history.back();
      }

      function generateCode() {
        var code = String(Math.floor(10000000 + Math.random() * 90000000));
        var data = {
          type: "sidebot_admin_invite_code_generate",
          purpose: String(purposeSelect.value || "webinar"),
          series: String(seriesSelect.value || "1"),
          code: code
        };
        resultCard.classList.remove("hidden");
        codeValue.textContent = code;
        statusText.textContent = "Invite code dihantar untuk disimpan.";
        if (!sendToTelegram(data)) {
          statusText.textContent = "Preview mode: invite code berjaya dijana secara simulasi.";
        }
      }

      function revokeCode(code) {
        if (!code) return;
        if (!window.confirm("Revoke invite code " + code + "?")) return;
        if (!sendToTelegram({ type: "sidebot_admin_invite_code_revoke", code: code })) {
          statusText.textContent = "Preview mode: revoke code " + code + ".";
        }
      }

      function revokeAllCodes() {
        if (!window.confirm("Revoke semua invite code aktif untuk campaign ini?")) return;
        if (!sendToTelegram({ type: "sidebot_admin_invite_code_revoke_all" })) {
          statusText.textContent = "Preview mode: revoke semua invite code aktif.";
        }
      }

      function renderExistingCodes() {
        campaignName.textContent = String(payload.campaign || "-");
        var rows = Array.isArray(payload.codes) ? payload.codes : [];
        codeList.innerHTML = "";
        if (!rows.length) {
          emptyState.classList.remove("hidden");
          revokeAllBtn.classList.add("hidden");
          return;
        }
        emptyState.classList.add("hidden");
        revokeAllBtn.classList.remove("hidden");
        rows.forEach(function (row) {
          var item = document.createElement("div");
          item.className = "code-row";
          item.innerHTML =
            '<div class="code-row-header">' +
              '<p class="code-row-title">' + row.code + '</p>' +
              '<button type="button" class="danger-btn" data-code="' + row.code + '">Revoke</button>' +
            '</div>' +
            '<p class="code-row-meta">' + row.series + ' · Dijana: ' + row.created_at + '</p>';
          codeList.appendChild(item);
        });
      }

      backBtn.addEventListener("click", backToMainMenu);
      tabGenerate.addEventListener("click", function () { openTab("generate"); });
      tabInfo.addEventListener("click", function () { openTab("info"); });
      generateBtn.addEventListener("click", generateCode);
      revokeAllBtn.addEventListener("click", revokeAllCodes);
      codeList.addEventListener("click", function (event) {
        var target = event.target;
        if (target && target.matches(".danger-btn[data-code]")) {
          revokeCode(String(target.getAttribute("data-code") || ""));
        }
      });

      renderExistingCodes();
    })();
  </script>
</body>
</html>
