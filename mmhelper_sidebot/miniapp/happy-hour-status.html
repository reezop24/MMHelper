<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Hour Status</title>
  <link rel="stylesheet" href="global.css" />
  <style>
    .content-card p {
      margin: 0;
      line-height: 1.55;
      color: #f0dde1;
      font-size: 14px;
    }

    .meta {
      margin-top: 10px;
      color: #d8c1c6;
      font-size: 12px;
    }

    .status-list {
      margin-top: 10px;
      display: grid;
      gap: 10px;
    }

    .status-card {
      border: 1px solid #5a3035;
      border-radius: 12px;
      background: rgba(27, 18, 20, 0.92);
      padding: 11px 12px;
    }

    .status-title {
      margin: 0 0 7px;
      font-size: 15px;
      font-weight: 800;
      color: #ffeef1;
    }

    .line {
      margin: 3px 0;
      font-size: 13px;
      color: #f0dde1;
      line-height: 1.45;
    }

    .label {
      color: #d8c1c6;
      font-weight: 700;
      margin-right: 4px;
    }

    .topic-list {
      margin: 6px 0 0;
      padding-left: 16px;
      color: #ffeef1;
      font-size: 13px;
      line-height: 1.4;
    }

    .empty {
      border: 1px dashed #8d4d54;
      border-radius: 12px;
      background: rgba(43, 18, 22, 0.8);
      color: #f0dde1;
      padding: 12px;
      text-align: center;
      font-size: 13px;
    }

    .danger-wrap {
      margin-top: 14px;
      border-top: 1px dashed #5a3035;
      padding-top: 10px;
      display: flex;
      justify-content: flex-end;
    }

    .danger-btn {
      border: 1px solid #ef4444;
      background: rgba(127, 29, 29, 0.9);
      color: #fee2e2;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 10px;
      cursor: pointer;
    }

    .status-text {
      margin-top: 8px;
      color: #f0dde1;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top-nav">
      <button id="backBtn" type="button" class="top-back-btn">← Back</button>
    </div>

    <header class="hero">
      <img class="logo" src="logo.png" alt="NEXTexclusive Logo" />
      <h1>Happy Hour Status</h1>
      <p>Admin Panel</p>
    </header>

    <section class="card content-card">
      <p>Paparan sesi Happy Hour aktif dan penggunaan quota free user.</p>
      <p id="meta" class="meta">Loading...</p>
      <section id="list" class="status-list"></section>

      <div class="danger-wrap">
        <button id="resetBtn" type="button" class="danger-btn">Reset Happy Hour</button>
      </div>
      <p id="statusText" class="status-text"></p>
    </section>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      var listEl = document.getElementById("list");
      var metaEl = document.getElementById("meta");
      var statusText = document.getElementById("statusText");
      var resetBtn = document.getElementById("resetBtn");
      var backBtn = document.getElementById("backBtn");

      function parsePayload() {
        try {
          var raw = new URLSearchParams(window.location.search).get("happy_hour_status_payload");
          if (!raw) return { active_sessions: [], generated_at: "-" };
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return { active_sessions: [], generated_at: "-" };
          return {
            active_sessions: Array.isArray(parsed.active_sessions) ? parsed.active_sessions : [],
            generated_at: String(parsed.generated_at || "-")
          };
        } catch (e) {
          return { active_sessions: [], generated_at: "-" };
        }
      }

      function renderCard(item) {
        var topics = Array.isArray(item.topics) ? item.topics : [];
        var topicHtml = "";
        if (!topics.length) {
          topicHtml = '<div class="line">- Tiada topik</div>';
        } else {
          topicHtml = "<ul class=\"topic-list\">";
          for (var i = 0; i < topics.length; i += 1) {
            topicHtml += "<li>" + topics[i] + "</li>";
          }
          topicHtml += "</ul>";
        }
        return (
          '<article class="status-card">' +
            '<p class="status-title">Session ' + (item.session_id || "-") + '</p>' +
            '<p class="line"><span class="label">Masa Tamat:</span>' + (item.ends_at || "-") + '</p>' +
            '<p class="line"><span class="label">Notification:</span>' + (item.notify_user ? "ON" : "OFF") + '</p>' +
            '<p class="line"><span class="label">Free User Guna Quota:</span>' + String(item.free_user_used || 0) + '</p>' +
            '<p class="line"><span class="label">Topik:</span></p>' +
            topicHtml +
          "</article>"
        );
      }

      function render(data) {
        metaEl.textContent = "Last update: " + (data.generated_at || "-");
        if (!data.active_sessions.length) {
          listEl.innerHTML = '<div class="empty">Tiada sesi Happy Hour aktif sekarang.</div>';
          return;
        }
        var html = "";
        for (var i = 0; i < data.active_sessions.length; i += 1) {
          html += renderCard(data.active_sessions[i] || {});
        }
        listEl.innerHTML = html;
      }

      function sendReset() {
        var ok = window.confirm("Confirm reset semua sesi Happy Hour?");
        if (!ok) return;
        var payload = {
          type: "sidebot_admin_happy_hour_reset",
          confirm: true
        };
        if (tg) {
          tg.sendData(JSON.stringify(payload));
          tg.close();
          return;
        }
        statusText.textContent = "Preview mode: reset request dihantar.";
      }

      function backToMainMenu() {
        var payload = { type: "sidebot_back_to_main_menu" };
        if (tg) {
          tg.sendData(JSON.stringify(payload));
          tg.close();
          return;
        }
        window.history.back();
      }

      resetBtn.addEventListener("click", sendReset);
      backBtn.addEventListener("click", backToMainMenu);
      render(parsePayload());
    })();
  </script>
</body>
</html>
